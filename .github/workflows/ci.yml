name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs on the same ref — same convention as
# codefly-dev/core. A superseded commit doesn't need to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.0"

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go



      - name: Build
        run: go build ./...

      - name: Test
        run: go test  ./...

  nix-flake-check:
    # Strict: every codefly plugin ships a flake.nix so it can be
    # built reproducibly via nix in production. This step validates
    # the flake's structure (inputs, outputs, dev shells); a broken
    # flake means the plugin can't be installed via nix and would
    # drop out of the production path. Build + vendorHash baking is
    # a separate per-release job — see the flake.nix doc-comment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # main
      - name: nix flake check
        run: nix flake check --no-build
